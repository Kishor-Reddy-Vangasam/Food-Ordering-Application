<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Orders - FoodPulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <main>
        <!-- Active Orders Section -->
        <section style="margin-bottom: 4rem;">
            <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 2rem;">Active Orders Tracking</h1>
            <div id="current-orders-container">
                <!-- Dynamically populated with timelines -->
            </div>
        </section>

        <!-- Previous Orders Section -->
        <section>
            <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem;">Previous Orders</h2>
            <div id="previous-orders-container">
                <!-- Dynamically populated in tabular layout -->
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
