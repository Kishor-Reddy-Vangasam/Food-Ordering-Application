<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu - FoodPulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <main>
        <!-- Restaurant Header Details -->
        <div id="menu-restaurant-info" class="glass" style="padding: 2.5rem; border-radius: var(--radius-lg); margin-bottom: 2.5rem;">
            <!-- Populated dynamically -->
        </div>

        <!-- Category Filters -->
        <div id="menu-category-pills" style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
            <!-- Populated dynamically -->
        </div>

        <!-- Food Menu Grid -->
        <div id="menu-items-grid" class="grid-foods">
            <!-- Populated dynamically -->
        </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
