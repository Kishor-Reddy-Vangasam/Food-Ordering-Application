<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodPulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <main>
        <div class="form-container glass">
            <h2 class="form-title">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-role">Select Role</label>
                    <select id="login-role">
                        <option value="customer">Customer</option>
                        <option value="restaurant">Restaurant Manager</option>
                        <option value="admin">System Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="login-email">Email / Owner Name</label>
                    <input type="text" id="login-email" placeholder="Enter your email or owner name" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password / Contact</label>
                    <input type="password" id="login-password" placeholder="Enter password or contact" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
            </form>
            <div class="form-footer">
                Don't have a Customer account? <a href="register.html">Register Here</a>
            </div>
            <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <strong>Admin Login:</strong> admin@foodpulse.com / admin123 <br/>
                <strong>Sample Customer:</strong> rahul@gmail.com / rahul123 <br/>
                <strong>Sample Restaurant Owner:</strong> Anil Kumar / 9876501234
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
