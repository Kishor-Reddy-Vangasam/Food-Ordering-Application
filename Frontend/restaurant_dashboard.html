<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Manager - FoodPulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <main>
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 2rem;">Restaurant Management Portal</h1>
        
        <div class="dashboard-grid">
            <!-- Left Side: Profile and Add Food Form -->
            <div class="panel-side">
                <div id="rest-details-info" class="profile-card glass">
                    <!-- Populated dynamically -->
                </div>
                
                <!-- Add Food Form -->
                <div class="glass" style="padding: 2rem; border-radius: var(--radius-lg);">
                    <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem;">Add New Menu Item</h3>
                    <form id="rest-add-food-form">
                        <div class="form-group">
                            <label for="food-name">Food Name</label>
                            <input type="text" id="food-name" placeholder="e.g. Garlic Butter Naan" required>
                        </div>
                        <div class="form-group">
                            <label for="food-category">Category</label>
                            <input type="text" id="food-category" placeholder="e.g. Starters, Main Course" required>
                        </div>
                        <div class="form-group">
                            <label for="food-price">Price (₹)</label>
                            <input type="number" id="food-price" step="0.01" min="1" placeholder="e.g. 150" required>
                        </div>
                        <div class="form-group">
                            <label for="food-avail">Availability</label>
                            <select id="food-avail">
                                <option value="Available">Available</option>
                                <option value="Out of Stock">Out of Stock</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="food-img">Image Asset File</label>
                            <input type="text" id="food-img" placeholder="e.g. biryani.jpg, pizza.jpg" value="biryani.jpg">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Add Item</button>
                    </form>
                </div>
            </div>
            
            <!-- Right Side: Stats, Menu List, Orders List -->
            <div class="panel-main">
                <!-- Stats -->
                <div id="rest-stats-container" class="stat-grid">
                    <!-- Populated dynamically -->
                </div>
                
                <!-- Order Fulfillment Table -->
                <div class="glass" style="padding: 2rem; border-radius: var(--radius-lg);">
                    <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 1.5rem;">Fulfill Customer Orders</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Amount</th>
                                    <th>Payment Status</th>
                                    <th>Order Status</th>
                                </tr>
                            </thead>
                            <tbody id="rest-orders-table">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Menu Management Table -->
                <div class="glass" style="padding: 2rem; border-radius: var(--radius-lg);">
                    <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 1.5rem;">Manage Menu Items</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Food Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Availability</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="rest-foods-table">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
